apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: observability-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
        metrics: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
            - name: status
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8081/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: config
          configMap:
            name: nginx-config
