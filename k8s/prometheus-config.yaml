apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: nginx
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [observability-demo]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_metrics]
            regex: nginx
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
